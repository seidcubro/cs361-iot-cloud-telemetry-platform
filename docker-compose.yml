# Historical M4 local prototype only.
# Current backend source of truth is services/ + k8s-eks/ with AWS services.
services:
  ingestion:
    build: ./services/ingestion
    ports:
      - "8081:8080"
    environment:
      - DATA_PATH=/data/latest.json
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./services/api
    ports:
      - "8082:8080"
    environment:
      - DATA_PATH=/data/latest.json
    volumes:
      - ./data:/data
    depends_on:
      ingestion:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
