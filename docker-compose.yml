services:
  ingestion:
    build: ./services/ingestion
    ports:
      - "8081:8080"
    environment:
      - DATA_PATH=/data/latest.json
    volumes:
      - ./data:/data

  api:
    build: ./services/api
    ports:
      - "8082:8080"
    environment:
      - DATA_PATH=/data/latest.json
    volumes:
      - ./data:/data

