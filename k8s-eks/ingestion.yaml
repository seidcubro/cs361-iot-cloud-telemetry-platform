apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: 094728020196.dkr.ecr.us-east-1.amazonaws.com/cs361-ingestion:m8-security
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: SQS_QUEUE_URL
              value: https://sqs.us-east-1.amazonaws.com/094728020196/cs361-telemetry-queue
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: telemetry-secrets
                  key: API_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-creds
                  key: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-svc
  namespace: telemetry
spec:
  type: LoadBalancer
  selector:
    app: ingestion
  ports:
    - port: 80
      targetPort: 8080
