apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: 094728020196.dkr.ecr.us-east-1.amazonaws.com/cs361-api:m7-eks
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: SQS_QUEUE_URL
              value: https://sqs.us-east-1.amazonaws.com/094728020196/cs361-telemetry-queue
            - name: DDB_TABLE
              value: Telemetry
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-creds
                  key: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: telemetry
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080

