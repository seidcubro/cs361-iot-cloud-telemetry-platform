<!DOCTYPE html>
<html>
<head>
  <title>IoT Dashboard</title>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .dashboard {
      display: flex;
      gap: 30px;
      padding: 20px;
      justify-content: center;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .right-panel {
      flex-grow: 1;
      max-width: 900px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 250px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .value {
      font-size: 1.8em;
      margin: 10px 0;
    }

    .label {
      color: #94a3b8;
    }

    select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 250px;
    }

    canvas {
      width: 100% !important;
      height: 500px !important;
    }

    @media (max-width: 900px) {
      .dashboard {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>

<h1>🏠 IoT Dashboard</h1>

<div class="dashboard">

  <div class="left-panel">

    <select id="deviceSelect">
      <option value="living_room">Living Room</option>
      <option value="patio">Patio</option>
      <option value="garage">Garage</option>
    </select>

    <select id="timeframeSelect">
      <option value="1">Last 1 Hour</option>
      <option value="6">Last 6 Hours</option>
      <option value="24" selected>Last 24 Hours</option>
      <option value="168">Last 7 Days</option>
    </select>

    <div class="card">
      <div class="label">Temperature</div>
      <div class="value" id="temp">--</div>
    </div>

    <div class="card">
      <div class="label">Humidity</div>
      <div class="value" id="humidity">--</div>
    </div>

    <div class="card">
      <div class="label">Last Updated</div>
      <div class="value" id="time">--</div>
    </div>

    <div class="card">
      <div class="label" id="avgTempLabel">Avg Temperature</div>
      <div class="value" id="avgTemp">--</div>
    </div>

    <div class="card">
      <div class="label" id="avgHumidityLabel">Avg Humidity</div>
      <div class="value" id="avgHumidity">--</div>
    </div>

  </div>

  <div class="right-panel">
    <canvas id="historyChart"></canvas>
  </div>

</div>

<script>
const API_URL = "http://afc732df2d7d84597acd039c5610bef9-252739920.us-east-1.elb.amazonaws.com";
const API_KEY = "YOUR_API_KEY_HERE";

let chart;

/* =========================
   LIVE DATA
========================= */
async function fetchData() {
  const device = document.getElementById("deviceSelect").value;

  try {
    const res = await fetch(
      `${API_URL}/v1/telemetry/latest?device_id=${device}`,
      { headers: { "x-api-key": API_KEY } }
    );

    const data = await res.json();

    document.getElementById("temp").innerText =
      data.temperature_f?.toFixed(2) + " °F";

    document.getElementById("humidity").innerText =
      data.humidity_pct?.toFixed(2) + " %";

    const date = new Date(data.timestamp * 1000);
    document.getElementById("time").innerText =
      date.toLocaleDateString() + " " + date.toLocaleTimeString();

  } catch (err) {
    console.error(err);
  }
}

/* =========================
   HELPERS
========================= */

function formatLabel(ts, hours) {
  const d = new Date(ts * 1000);
  return hours <= 24
    ? d.toLocaleTimeString()
    : d.toLocaleDateString() + " " + d.toLocaleTimeString();
}

function smooth(data, w = 3) {
  return data.map((_, i, arr) => {
    const start = Math.max(0, i - w);
    const subset = arr.slice(start, i + 1);
    return subset.reduce((a,b)=>a+b,0)/subset.length;
  });
}

/* =========================
   HISTORY WITH BUCKETING
========================= */

async function fetchHistory() {
  const device = document.getElementById("deviceSelect").value;
  const hours = parseInt(document.getElementById("timeframeSelect").value);

  let bucket;
  if (hours <= 6) bucket = 10;
  else if (hours <= 24) bucket = 60;
  else if (hours <= 168) bucket = 300;
  else bucket = 1800;

  const canvas = document.getElementById("historyChart");
  canvas.style.opacity = 0.4;

  try {
    const res = await fetch(
      `${API_URL}/v1/telemetry/history?device_id=${device}&hours=${hours}&bucket=${bucket}`,
      { headers: { "x-api-key": API_KEY } }
    );

    let data = await res.json();

    data.sort((a,b)=>a.timestamp-b.timestamp);

    const labels = data.map(d => formatLabel(d.timestamp, hours));
    const temps = data.map(d => d.temperature_f ?? null);
    const humidity = data.map(d => d.humidity_pct ?? null);

    const validTemps = temps.filter(t=>t!=null);
    const validHum = humidity.filter(h=>h!=null);

    const avgTemp = validTemps.length ? validTemps.reduce((a,b)=>a+b,0)/validTemps.length : null;
    const avgHum = validHum.length ? validHum.reduce((a,b)=>a+b,0)/validHum.length : null;

    document.getElementById("avgTemp").innerText =
      avgTemp ? avgTemp.toFixed(2)+" °F" : "--";

    document.getElementById("avgHumidity").innerText =
      avgHum ? avgHum.toFixed(2)+" %" : "--";

    document.getElementById("avgTempLabel").innerText =
      `Avg Temperature (Last ${hours}h)`;

    document.getElementById("avgHumidityLabel").innerText =
      `Avg Humidity (Last ${hours}h)`;

    renderChart(labels, smooth(temps), humidity);

  } catch (err) {
    console.error(err);
  }

  canvas.style.opacity = 1;
}

/* =========================
   CHART
========================= */

function renderChart(labels, temps, humidity) {
  if (chart) chart.destroy();

  const ctx = document.getElementById("historyChart").getContext("2d");

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "Temperature (°F)", data: temps, yAxisID:"y1" },
        { label: "Humidity (%)", data: humidity, yAxisID:"y2" }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      scales: {
        y1: { position:"left" },
        y2: { position:"right", grid:{drawOnChartArea:false} }
      }
    }
  });
}

/* =========================
   EVENTS
========================= */

document.getElementById("deviceSelect")
  .addEventListener("change", ()=>{ fetchData(); fetchHistory(); });

document.getElementById("timeframeSelect")
  .addEventListener("change", fetchHistory);

/* =========================
   INIT
========================= */

fetchData();
fetchHistory();
setInterval(fetchData, 30000);

</script>

</body>
</html>
